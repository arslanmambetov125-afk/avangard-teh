<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Штаб 2.2 — AI Chief of Staff</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#070a10;color:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#182038 0,#090d16 42%,#05070c 100%);min-height:100vh}.shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:28px;border-right:1px solid #20283a;background:rgba(7,10,16,.86);backdrop-filter:blur(18px)}.brand{font-weight:800;font-size:22px}.brand small{display:block;color:#7f8aa3;font-size:12px;font-weight:600;margin-top:6px}.back{display:inline-flex;margin-top:30px;color:#bac6df;text-decoration:none}.thread-list{margin-top:30px;display:grid;gap:8px}.thread{width:100%;text-align:left;border:1px solid #252f45;background:#0e1420;color:#eaf0ff;padding:12px 14px;border-radius:12px;cursor:pointer}.thread.active{border-color:#6f86ff;background:#131c31}.main{display:flex;flex-direction:column;min-width:0}.top{padding:24px 32px;border-bottom:1px solid #20283a;display:flex;justify-content:space-between;align-items:center}.top h1{font-size:20px;margin:0}.status{font-size:12px;color:#9fb0d0}.messages{flex:1;padding:32px;overflow:auto;display:grid;align-content:start;gap:16px}.msg{max-width:820px;padding:16px 18px;border:1px solid #263149;border-radius:16px;white-space:pre-wrap;line-height:1.55}.msg.user{justify-self:end;background:#18213a}.msg.assistant{justify-self:start;background:#0d1320}.action-card{justify-self:start;max-width:820px;border:1px solid #2d4c3b;background:#0d1914;padding:12px 16px;border-radius:14px;color:#ccebd9}.action-card.error{border-color:#5f3338;background:#1c1013;color:#f0c5ca}.action-card b{display:block;font-size:13px}.action-card small{display:block;margin-top:4px;color:inherit;opacity:.75}.composer{padding:20px 32px 28px;border-top:1px solid #20283a;background:rgba(7,10,16,.92)}.box{display:flex;gap:12px;max-width:980px;margin:auto}textarea{flex:1;resize:none;min-height:70px;max-height:180px;border:1px solid #2b3650;background:#0d1320;color:#fff;border-radius:16px;padding:16px;font:inherit}button.send,button.new{border:0;border-radius:14px;background:#7286ff;color:#fff;font-weight:700;padding:0 20px;cursor:pointer}button.new{padding:11px 14px}.empty{color:#8592ab;text-align:center;margin-top:20vh}.hint{max-width:980px;margin:8px auto 0;color:#65718a;font-size:11px}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.messages,.top,.composer{padding-left:18px;padding-right:18px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side"><div class="brand">S2 · AI Chief of Staff<small>Общая память и реальные действия</small></div><a class="back" href="/">← Вернуться в Штаб</a><button class="new" id="newThread" style="margin-top:24px">+ Новый диалог</button><div id="threads" class="thread-list"></div></aside>
  <main class="main"><header class="top"><h1>ChatGPT × Штаб 2.2</h1><span id="status" class="status">Проверяем сессию…</span></header><section id="messages" class="messages"><div class="empty">AI видит проекты, задачи, цели и память. По явной команде он может менять данные Штаба.</div></section><form id="form" class="composer"><div class="box"><textarea id="input" placeholder="Например: создай задачу по AVELNARO — подготовить оффер до завтра 18:00"></textarea><button class="send" type="submit">Отправить</button></div><div class="hint">Enter — новая строка · Ctrl/⌘ + Enter — отправить. Удаление и финансовые операции AI не выполняет.</div></form></main>
</div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.112.4';
const sb=createClient('https://vnpkczboxrhscplxivvx.supabase.co','sb_publishable_Giap9iC_aWfhoHN8n9oLJg_DpKYQSGu');
const $=id=>document.getElementById(id); let session=null; let threadId=sessionStorage.getItem('shtab-ai-thread')||null;
function scrollBottom(){$('messages').scrollTop=$('messages').scrollHeight}
function add(role,text){const el=document.createElement('div');el.className='msg '+role;el.textContent=text;$('messages').querySelector('.empty')?.remove();$('messages').append(el);scrollBottom()}
function addAction(action){const el=document.createElement('div');el.className='action-card'+(action?.ok===false?' error':'');const title=document.createElement('b');title.textContent=action?.ok===false?'Действие не выполнено':'✓ '+(action?.action||'Изменение сохранено');const detail=document.createElement('small');detail.textContent=action?.error||action?.title||action?.project||action?.key||'';el.append(title,detail);$('messages').append(el);scrollBottom()}
async function loadThreads(){const {data}=await sb.from('ai_chat_threads').select('id,title,updated_at').order('updated_at',{ascending:false}).limit(20);$('threads').innerHTML='';(data||[]).forEach(t=>{const b=document.createElement('button');b.className='thread'+(t.id===threadId?' active':'');b.textContent=t.title;b.onclick=()=>selectThread(t.id);$('threads').append(b)})}
async function selectThread(id){threadId=id;sessionStorage.setItem('shtab-ai-thread',id);$('messages').innerHTML='';const {data}=await sb.from('ai_chat_messages').select('role,content,created_at').eq('thread_id',id).order('created_at',{ascending:true}).limit(100);(data||[]).forEach(m=>add(m.role,m.content));loadThreads()}
$('newThread').onclick=()=>{threadId=null;sessionStorage.removeItem('shtab-ai-thread');$('messages').innerHTML='<div class="empty">Новый диалог. Контекст проектов и задач подгрузится автоматически.</div>';loadThreads()};
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();$('form').requestSubmit()}});
$('form').onsubmit=async e=>{e.preventDefault();const text=$('input').value.trim();if(!text||!session)return;$('input').value='';add('user',text);$('status').textContent='AI анализирует и выполняет…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({message:text,threadId})});const data=await r.json();if(!r.ok)throw new Error(data.detail||data.error||'Ошибка');threadId=data.threadId;sessionStorage.setItem('shtab-ai-thread',threadId);(data.actions||[]).forEach(addAction);add('assistant',data.answer);await loadThreads();$('status').textContent=(data.actions||[]).length?'Изменения записаны в Штаб':'Синхронизировано с Supabase';}catch(err){add('assistant','Ошибка подключения: '+err.message);$('status').textContent='Ошибка AI-синхронизации'}};
const {data:{session:s}}=await sb.auth.getSession();session=s;if(!session){$('status').textContent='Сначала войди в основной Штаб';$('form').style.display='none';}else{$('status').textContent='Сессия активна';await loadThreads();if(threadId)await selectThread(threadId)}
</script>
</body></html>
